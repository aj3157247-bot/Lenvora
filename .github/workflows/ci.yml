name: Lenvora CI
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate structure
        run: |
          set -e
          for dir in android admin backend database models shared docs; do
            test -d "$dir" || { echo "Missing directory: $dir"; exit 1; }
          done
          test -f backend/package-lock.json
          test -f admin/package-lock.json
          echo "Structure and lockfiles OK"
